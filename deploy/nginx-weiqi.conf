# 围棋 AI 服务 — nginx 站点配置
# 由主 nginx.conf 的 http{} 末尾 include 进来(因此本文件顶部可写 http 级指令)
# 对外入口:仅 80。整站 Basic Auth,后端只监听 127.0.0.1:8080

# 限流键:默认按来源 IP;走 Cloudflare Tunnel 后所有请求源都是 127.0.0.1,
# 届时改用 CF-Connecting-IP(隧道是唯一入站路径,该头无法被外部伪造)
# map $http_cf_connecting_ip $weiqi_client {
#     default $http_cf_connecting_ip;
#     ""      $remote_addr;
# }
# 然后把下面两个 zone 的 key 换成 $weiqi_client

limit_req_zone  $remote_addr zone=weiqi_ai:1m   rate=6r/s;
limit_conn_zone $remote_addr zone=weiqi_conn:1m;

server {
    listen       80 default_server;
    server_name  _;

    # 不暴露 nginx 版本号
    server_tokens off;

    # 前端构建产物
    root /path/to/weiqi/dist;
    index index.html;

    # 整站口令(与访问者共用一组;密码文件在项目仓库之外)
    auth_basic           "围棋对局";
    auth_basic_user_file ~/weiqi-nginx/conf.d/weiqi.passwd;

    access_log ~/weiqi-nginx/logs/site.access.log;
    error_log  ~/weiqi-nginx/logs/site.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    # AI 接口:限频率 + 限并发,防被刷爆 KataGo 算力
    location /api/ai/ {
        limit_req   zone=weiqi_ai burst=8 nodelay;
        limit_conn  weiqi_conn 4;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        # analyze 是 NDJSON 长连接,必须关掉缓冲否则拿不到逐步结果
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        client_max_body_size 4m;
    }

    # 模型加载/卸载/切换:只允许本机调用(远程界面不锁,靠整站口令)
    location /api/ {
        limit_req  zone=weiqi_ai burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 4m;
    }

    location = /api/health {
        # 健康探测不走限流,也不给外部看细节(后端按 X-Real-IP 判断是否屏蔽路径)
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        access_log off;
    }

    # 带哈希的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 注:本机 nginx 编译时未带 PCRE,不能使用 `location ~` 正则;
    # dist/ 内无点文件,无需额外 deny

    location / {
        try_files $uri $uri/ /index.html;
    }
}
